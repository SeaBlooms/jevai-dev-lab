name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - prompts/**
      - static/**
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/seablooms/jevai-dev-lab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}

      # Pull requests only check that the image builds; main and tags publish it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load -t jev-smoke .
          docker run -d --name jev -e JEV_API_TOKEN=ci -p 127.0.0.1:8790:8790 jev-smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8790/health && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer ci" http://127.0.0.1:8790/prompts
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/prompts)" = 401
          docker logs jev
