id: summarize
title: Summarize a short paragraph
prompt: |
  Summarize the following in two sentences, then list three concrete next steps as a bullet list.

  aidr-hook-observability is a local dashboard for AI-agent guardrail hooks. It taps
  debug logs and redacted captures, then serves them on loopback. Callers can ask this
  sandbox for a second opinion on a single verdict without changing what the hook relayed.
